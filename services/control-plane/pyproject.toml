[project]
name = "reliability"
version = "0.1.0"
description = "Agentic AI Software Reliability Engineer — control plane (API, workers, agents)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.27",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "boto3>=1.35",
  "dnspython>=2.7",
  "jsonschema>=4.23",
  "numpy>=2.1",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-postgres>=2.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "email-validator>=2.2",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.118",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-pyyaml",
  "runner-agent",
]

[tool.uv.sources]
runner-agent = { path = "../runner-agent", editable = true }

[project.scripts]
reliability = "reliability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres and Redis",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "RUF012", "B008", "S105", "S106", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["reliability.modules.admission.*", "reliability.modules.runs.*", "reliability.modules.verification.*"]
disallow_untyped_defs = true
