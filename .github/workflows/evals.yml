name: evals

# Agent evaluation gate (evaluation.md §4): runs on changes to agents, the LLM gateway, test
# compilation or the corpus. Deterministic baseline on every PR; the model step runs only
# where the repository secret is available (never for forks).
on:
  pull_request:
    paths:
      - "services/control-plane/src/reliability/agents/**"
      - "services/control-plane/src/reliability/llm/**"
      - "services/control-plane/src/reliability/modules/testsuites/**"
      - "services/control-plane/src/reliability/modules/workflows/**"
      - "services/control-plane/src/reliability/modules/diagnosis/**"
      - "services/control-plane/src/reliability/modules/repairs/**"
      - "services/control-plane/src/reliability/modules/verification/**"
      - "services/control-plane/tests/support/repairs.py"
      - "services/runner-agent/**"
      - "services/control-plane/tests/benchmark/**"
      - "services/control-plane/tests/support/defects.py"
      - "benchmarks/**"
      - ".github/workflows/evals.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: services/control-plane
    env:
      RE_ENV: test
      RA_SANDBOX_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "0.5.11" }
      - uses: grafana/setup-k6-action@v1
        with: { k6-version: "0.54.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync --frozen --extra dev
      - name: Install reference app dependencies
        run: npm install --no-audit --no-fund
        working-directory: benchmarks/reference-apps/express-notes
      - name: Deterministic baseline
        run: uv run python ../../benchmarks/harness/run_evals.py --sandbox --out ../../benchmarks/out/baseline
      - name: With model
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          RE_ANTHROPIC_API_KEY: ${{ secrets.RE_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$RE_ANTHROPIC_API_KEY" ]; then echo "no API key configured; skipping"; exit 0; fi
          RE_LLM_PROVIDER=anthropic uv run python ../../benchmarks/harness/run_evals.py --llm --out ../../benchmarks/out/llm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: benchmarks/out/
      - name: Summary
        if: always()
        run: cat ../../benchmarks/out/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true

  # Diagnosis benchmark (Phase 7 gate): every labelled corpus defect runs in a real sandbox,
  # gets a finding and a diagnosis; gates top-3/top-1 precision, citation validity, calibration.
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.6
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/control-plane
    env:
      RE_ENV: test
      PGPASSWORD: postgres
      RE_TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RE_RUN_BENCHMARK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "0.5.11" }
      - uses: grafana/setup-k6-action@v1
        with: { k6-version: "0.54.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync --frozen --extra dev
      - name: Bootstrap database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../../scripts/db-bootstrap.sql
      - name: Diagnosis benchmark
        run: uv run pytest -s -q tests/benchmark/test_diagnosis_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnosis-benchmark
          path: benchmarks/out/diagnosis.*
      - name: Summary
        if: always()
        run: cat ../../benchmarks/out/diagnosis.md >> "$GITHUB_STEP_SUMMARY" || true

  # Repair benchmark (Phase 8 gate): oracle repairs must be verified (≥ 90%), decoy patches must
  # never be (< 5% false-verified). With the model secret, the agent's own verified rate (≥ 40%).
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16.6
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/control-plane
    env:
      RE_ENV: test
      PGPASSWORD: postgres
      RE_TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RE_RUN_BENCHMARK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { version: "0.5.11" }
      - uses: grafana/setup-k6-action@v1
        with: { k6-version: "0.54.0" }
      - run: uv sync --frozen --extra dev
      - name: Bootstrap database roles
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../../scripts/db-bootstrap.sql
      - name: Repair benchmark (oracle agent)
        run: uv run pytest -s -q tests/benchmark/test_repair_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-benchmark
          path: benchmarks/out/repair.*
      - name: Summary
        if: always()
        run: cat ../../benchmarks/out/repair.md >> "$GITHUB_STEP_SUMMARY" || true
